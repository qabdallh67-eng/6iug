name: Build Whiteboard App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - 'package.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract uploaded project archive
        shell: bash
        run: |
          shopt -s nullglob
          archives=( *.zip )
          if [ ${#archives[@]} -gt 0 ]; then
            unzip -oq "${archives[0]}" -d .
          fi
          test -f package.json || { echo "Project archive is missing package.json"; exit 1; }
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production app
        run: npm run build
      - name: Upload website build
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
